# Knowledge Agent Web —— nginx 配置
# 双职责：1. 托管 Vite 构建的 SPA 静态文件 2. 反代 /api 到后端 server:3000
#
# SSE：对话接口（chat.controller.ts，@Post + @Res + StreamData）是 SSE 流式。
#   nginx 默认 proxy_buffering on 会缓冲流式输出（客户端收不到逐 token），
#   proxy_read_timeout 默认 60s 会断长回复。/api location 必须显式关缓冲 + 加长超时。

server {
    listen 80;
    server_name _;

    # 文档上传体积上限：nginx 默认 1m，PDF/DOCX 轻松超限会直接 413（请求到不了后端）
    # 后端 multer 也未配 limits（document.controller.ts 裸 FileInterceptor），全栈部署下这里是最外层闸门
    client_max_body_size 50m;

    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩（JS/CSS 体积大，显著减少首屏传输）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA history 模式：所有非文件请求回落到 index.html（vue-router history 模式必需）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反代后端 API：前端 request.ts 用相对路径 /api/v1，同源直达 nginx 再转 server:3000
    # → 无跨域，server 的 CORS 白名单不用改
    location /api {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;          # SSE/keepalive 需要 HTTP/1.1
        proxy_buffering off;             # 关缓冲：流式输出直推客户端（SSE 关键）
        proxy_cache off;
        proxy_read_timeout 300s;         # 长回复不断流（默认 60s 会截断长答案）
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";  # 清除 Connection 头，启用长连接
    }

    # Vite 构建的静态资源带 hash，可长期强缓存
    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
